[package]
name = "silo"
version = "0.1.0"
edition = "2021"
description = "A native, privacy-first local AI workbench and deep research agent with encrypted storage"
authors = ["herabel <https://github.com/herabel>"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/herabel/silo"
keywords = ["llm", "local-ai", "deep-research", "gui", "privacy"]
categories = ["command-line-utilities", "cryptography", "development-tools"]

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.29"
egui_extras = { version = "0.29", features = ["all_loaders"] }
tokio = { version = "1.40", features = ["full"] }
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
regex = "1.10"
arboard = "3.4"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

# Cryptography & Vault Storage
shake-entropy = { version = "0.1.12", features = ["std"] }
chacha20poly1305 = "0.10"
postcard = { version = "1.0", features = ["alloc"] }
argon2 = "0.5"
zeroize = { version = "1.8", features = ["derive"] }
